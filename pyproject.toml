[project]
name = "swiss-admin-text-simplification-eval"
version = "0.1.0"
description = "Comparing LLMs on plain-language simplification (Sprachvereinfachung) of Swiss administrative texts"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "zix @ git+https://github.com/machinelearningZH/zix_understandability-index",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
klartext-simplify = "pipeline:main"
klartext-xray = "diagnostics:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "diagnostics", "diffing", "evaluate", "llm_clients", "pipeline", "prompts", "simplify"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
