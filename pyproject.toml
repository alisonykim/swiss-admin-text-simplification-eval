[project]
name = "plain-language-ch-verwaltung"
version = "0.1.0"
description = "Comparing LLMs on plain-language simplification (Sprachvereinfachung) of Swiss administrative texts"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analysis = ["shap>=0.45", "scikit-learn>=1.4"]

[project.scripts]
plz-run = "plain_language_ch_verwaltung.pipeline:main"
plz-explain = "plain_language_ch_verwaltung.explain:main"
plz-xai = "plain_language_ch_verwaltung.xai:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
